name: Rust build and tests

on:
    pull_request:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: rust-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    rust:
        name: Rust (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
        env:
            CARGO_TERM_COLOR: always
            CARGO_BUILD_JOBS: 1
            CARGO_TARGET_DIR: ${{ github.workspace }}/tests/ci/target
            RUST_BACKTRACE: 1
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false
            - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
              with:
                  python-version: '3.13'
            - name: Install Rust
              run: rustup toolchain install 1.99.1 --profile minimal --no-self-update
            - name: Install Linux GUI build dependencies and test font
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libgl1-mesa-dev fonts-noto-cjk
            - name: Check CI runner
              run: python -m unittest discover -s tests/ci -p 'test_*.py' -v
            - name: Build every Rust crate and test harness
              timeout-minutes: 20
              run: python tests/ci/run_rust.py build
            - name: Run Rust tests
              if: ${{ !cancelled() }}
              timeout-minutes: 20
              run: python tests/ci/run_rust.py test
