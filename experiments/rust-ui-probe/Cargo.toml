[package]
name = "zipelo-rust-ui-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false
autotests = false
autoexamples = false
autobenches = false

[workspace]

[features]
default = []
ui = ["dep:eframe"]

[dependencies]
eframe = { version = "=0.37.0", optional = true, default-features = false, features = ["accesskit", "clipboard", "glow", "system_fonts", "wayland", "x11"] }

[[bin]]
name = "zipelo-ui-probe"
path = "../../tests/rust-ui-probe/app.rs"
required-features = ["ui"]

[[test]]
name = "ui_model"
path = "../../tests/rust-ui-probe/model.rs"
