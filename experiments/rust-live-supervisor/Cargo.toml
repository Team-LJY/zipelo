[package]
name = "zipelo-rust-live-supervisor-model"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false
autotests = false
autobenches = false
autoexamples = false

[workspace]

[dependencies]
zipelo-rust-host-errors = { path = "../rust-host-errors" }
libc = { version = "=0.2.191", default-features = false, features = ["std"] }
sha2 = { version = "=0.10.9", default-features = false, features = ["std", "force-soft"] }

[[test]]
name = "supervisor_model"
path = "../../tests/rust-live-supervisor/main.rs"
