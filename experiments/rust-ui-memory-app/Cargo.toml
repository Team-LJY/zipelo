[package]
name = "zipelo-ui-memory-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false
autotests = false

[workspace]

[lib]
doctest = false

[features]
default = []
ui = ["dep:eframe", "dep:wgpu", "dep:rfd", "dep:ashpd", "dep:pollster", "dep:wayland-client", "dep:wayland-backend", "dep:raw-window-handle", "dep:x11rb", "dep:x11-dl", "dep:windows-sys"]
ui-fixture = ["ui"]

[dependencies]
sha2 = "=0.10.9"
worker_protocol = { package = "zipelo-archive-worker", path = "../rust-archive-worker" }
eframe = { version = "=0.37.0", optional = true, default-features = false, features = ["accesskit", "clipboard", "glow", "system_fonts", "wayland", "x11"] }

# 창 밖으로 끌어 놓기에서 창 핸들을 얻을 때 씀(eframe과 같은 버전).
raw-window-handle = { version = "=0.6.2", optional = true }

[[bin]]
name = "zipelo-ui-memory-app"
path = "src/desktop.rs"
required-features = ["ui"]

[[test]]
name = "archive_ui"
path = "../../tests/rust-app-ui/regressions.rs"

[[test]]
name = "real_worker"
path = "../../tests/rust-app-real-worker/flows.rs"

[[test]]
name = "format_contract"
path = "../../tests/rust-app-real-worker/formats.rs"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "=0.11.1", optional = true, default-features = false, features = ["async-std"] }
pollster = { version = "=0.4.0", optional = true }
# 창 밖으로 끌어 놓기(Wayland wl_data_device). eframe/winit이 이미 쓰는 같은 버전을 씀.
wayland-client = { version = "=0.31.15", optional = true }
wayland-backend = { version = "=0.3.17", optional = true, features = ["client_system"] }
x11rb = { version = "=0.13.2", optional = true }
x11-dl = { version = "=2.21.0", optional = true }
rfd = { version = "=0.16.0", optional = true, default-features = false, features = ["xdg-portal", "async-std"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = { version = "=0.16.0", optional = true, default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "=30.0.1", optional = true, default-features = false, features = ["std", "dx12"] }
# 창 밖으로 끌어 놓기(지연 제공 IDataObject와 SHDoDragDrop).
windows-sys = { version = "=0.61.2", optional = true, features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
eframe = { version = "=0.37.0", optional = true, default-features = false, features = ["wgpu_no_default_features"] }

[[test]]
name = "renderer_fallback"
path = "../../tests/rust-app-ui/renderer_fallback.rs"
required-features = ["ui"]

[[bin]]
name = "zipelo-ui-capture"
path = "../../tests/rust-app-ui/capture.rs"
required-features = ["ui-fixture"]

[[test]]
name = "ui_scenarios"
path = "../../tests/rust-app-ui/scenario_tests.rs"
required-features = ["ui-fixture"]
