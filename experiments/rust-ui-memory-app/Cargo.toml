[package]
name = "zipelo-ui-memory-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false
autotests = false

[workspace]

[lib]
doctest = false

[features]
default = []
ui = ["dep:eframe", "dep:wgpu", "dep:rfd", "dep:ashpd", "dep:pollster"]
ui-fixture = ["ui"]

[dependencies]
sha2 = "=0.10.9"
worker_protocol = { package = "zipelo-archive-worker", path = "../rust-archive-worker" }
core_memory = { package = "zipelo-app-core-memory", path = "../rust-app-core-memory" }
eframe = { version = "=0.37.0", optional = true, default-features = false, features = ["accesskit", "clipboard", "glow", "system_fonts", "wayland", "x11"] }

[[bin]]
name = "zipelo-ui-memory-app"
path = "src/desktop.rs"
required-features = ["ui"]

[[test]]
name = "ui_memory"
path = "../../tests/rust-ui-memory-app/regressions.rs"

[[test]]
name = "archive_ui"
path = "../../tests/rust-app-ui/regressions.rs"

[[test]]
name = "real_worker"
path = "../../tests/rust-app-real-worker/flows.rs"

[[test]]
name = "format_contract"
path = "../../tests/rust-app-real-worker/formats.rs"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "=0.11.1", optional = true, default-features = false, features = ["async-std"] }
pollster = { version = "=0.4.0", optional = true }
rfd = { version = "=0.16.0", optional = true, default-features = false, features = ["xdg-portal", "async-std"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = { version = "=0.16.0", optional = true, default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "=30.0.1", optional = true, default-features = false, features = ["std", "dx12"] }
eframe = { version = "=0.37.0", optional = true, default-features = false, features = ["wgpu_no_default_features"] }

[[test]]
name = "renderer_fallback"
path = "../../tests/rust-app-ui/renderer_fallback.rs"
required-features = ["ui"]

[[bin]]
name = "zipelo-ui-capture"
path = "../../tests/rust-app-ui/capture.rs"
required-features = ["ui-fixture"]

[[test]]
name = "ui_scenarios"
path = "../../tests/rust-app-ui/scenario_tests.rs"
required-features = ["ui-fixture"]
