[package]
name = "zipelo-archive-worker"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
autotests = false

[dependencies]
png = "=0.18.1"
zune-jpeg = { package = "zipelo-jpeg", path = "vendor/zune-jpeg", default-features = false, features = ["std"] }
zune-core = { version = "=0.5.3", default-features = false, features = ["std"] }
bzip2 = "=0.6.1"
lzma-rust2 = { version = "=0.25.0", default-features = false, features = ["std", "xz"] }
aes = { version = "=0.8.4", features = ["zeroize"] }
hmac = "=0.12.1"
pbkdf2 = { version = "=0.12.2", default-features = false, features = ["hmac"] }
sha1 = "=0.10.7"
subtle = "=2.6.1"
zeroize = "=1.9.1"
sha2 = "=0.10.9"
zlib-rs = { version = "=0.6.8", default-features = false, features = ["rust-allocator"] }

[workspace]
exclude = ["vendor/zune-jpeg"]

[[test]]
name = "archive_worker"
path = "../../tests/rust-archive-worker/main.rs"

# 대용량 시험의 CRC와 Deflate에도 배포판의 최적화를 적용함.
[profile.dev.package.zlib-rs]
opt-level = 3

[profile.dev.package.libbz2-rs-sys]
opt-level = 3

[profile.dev.package.lzma-rust2]
opt-level = 3
