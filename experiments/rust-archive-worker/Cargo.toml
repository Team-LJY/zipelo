[package]
name = "zipelo-archive-worker"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
autotests = false

[dependencies]
aes = { version = "=0.8.4", features = ["zeroize"] }
hmac = "=0.12.1"
pbkdf2 = { version = "=0.12.2", default-features = false, features = ["hmac"] }
sha1 = "=0.10.7"
subtle = "=2.6.1"
zeroize = "=1.9.1"
sha2 = "=0.10.9"
zlib-rs = { version = "=0.6.8", default-features = false, features = ["rust-allocator"] }

[workspace]

[[test]]
name = "archive_worker"
path = "../../tests/rust-archive-worker/main.rs"
