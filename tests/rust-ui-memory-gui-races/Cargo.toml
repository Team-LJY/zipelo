[package]
name = "zipelo-ui-memory-gui-races"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false
autotests = false

[workspace]

[features]
default = []
gui-race-harness = ["dep:eframe"]

[dependencies]
core_memory = { package = "zipelo-app-core-memory", path = "../../experiments/rust-app-core-memory" }
eframe = { version = "=0.37.0", optional = true, default-features = false, features = ["accesskit", "clipboard", "glow", "system_fonts", "wayland", "x11"] }

[[bin]]
name = "zipelo-ui-memory-gui-races"
path = "main.rs"
required-features = ["gui-race-harness"]
